name: Publish

on:
  release:
    types:
      - released

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): npm exchanges this run's GitHub OIDC token for a publish token that
    # expires within minutes, instead of a long-lived NPM_TOKEN, and signs a provenance statement,
    # because the repository is public. It needs the Trusted Publisher on npmjs.com:
    # lenneTech / multer-gridfs-storage / publish.yml, no environment. Renaming this file breaks
    # publishing until that entry is changed too. Job-level `permissions` replaces the default token
    # permissions: `id-token: write` lets the job request the OIDC token, nothing here writes to the
    # repository.
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        node-version: [24.x]
        mongodb-version: [4.4]
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      # Node 24 instead of 16.13: OIDC needs npm >= 11.5.1, npm 12 needs ^24.15.0, and Node 22.22.2's
      # bundled npm cannot `npm install -g` (actions/runner-images#13883). `registry-url` pins the
      # registry npm publishes to.
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.3.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      - name: Install dependencies
        run: npm install

      #- name: Optimize and check
      #  run: npm run prepublishOnly

      - name: Build
        run: npm run build

      # Trusted Publishing needs npm >= 11.5.1. npm 12 is the major the lenneTech base packages
      # publish with through OIDC. Pinned to that major, not `@latest`, so a new npm major never
      # reaches a release run without having been tried first.
      - name: npm for Trusted Publishing
        run: npm install -g npm@12

      # The npm CLI itself, because JS-DevTools/npm-publish takes a token and cannot do OIDC. No
      # NPM_TOKEN fallback: npm would use it silently whenever the OIDC exchange fails and publish
      # without provenance. A failed exchange now fails the publish (rerun with `gh run rerun --failed`).
      # Unlike the old action, an already published version fails here instead of being skipped.
      #
      # `--ignore-scripts`: the package is built above; no lifecycle script runs in the publish step.
      - name: Publish
        run: npm publish --access public --ignore-scripts
